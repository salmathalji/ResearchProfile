on:
  workflow_dispatch:
  push:
    branches: main

name: Publish CV Redirect

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Prepare redirects to the personal homepage
        run: |
          rm -rf _site
          mkdir -p _site
          for page in index about contributing license 404; do
            cp redirect/index.html "_site/$page.html"
          done
          touch _site/.nojekyll

      - name: Publish rendered website
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
